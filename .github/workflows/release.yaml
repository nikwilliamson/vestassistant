name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the manifest with the release tag
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          python - "$version" <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("custom_components/vestassistant/manifest.json")
          data = json.loads(p.read_text())
          data["version"] = sys.argv[1]
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: Build the release asset
        run: |
          cd custom_components/vestassistant
          zip -r ../../vestassistant.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: vestassistant.zip

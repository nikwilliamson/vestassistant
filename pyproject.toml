[project]
name = "vestassistant"
version = "0.1.0"
description = "A message scheduler for Vestaboard, for Home Assistant"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["vestassistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The framework-free core is imported directly, without Home Assistant.
pythonpath = ["custom_components/vestassistant"]
